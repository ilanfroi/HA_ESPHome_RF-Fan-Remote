# ======================================================================
# Bedrooms RF2 - ESP32-C3 Super Mini Plus + CC1101 (E07-M1101D)
# Full TX+RX for Hila Fan and Bedroom Fan
# TX Format: Broadlink-style raw timings (394µs/1182µs, no sync, 7093µs gap)
# ======================================================================
# CC1101 wiring (ESP32-C3 Super Mini Plus):
#   GDO0 (TX/RX) -> GPIO2
#   CSN          -> GPIO7
#   SCK          -> GPIO4
#   MOSI         -> GPIO6
#   MISO         -> GPIO5
#   GDO2         -> GPIO3 (unused)
#   VCC          -> 3.3V
#   GND          -> GND

esphome:
  name: bedrooms-rf2
  friendly_name: Bedrooms RF2
  platformio_options:
    lib_deps:
      - SPI
  on_boot:
    priority: -100
    then:
      - lambda: 'id(mycc1101).recv();'

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: arduino

external_components:
  - source: github://juanboro/esphome-radiolib-cc1101@main
    components: [ radiolib_cc1101 ]

logger:
  level: DEBUG
  logs:
    remote_receiver: INFO
    remote_transmitter: INFO

api:
  encryption:
    key: "T1EdFuEWO4ucSNHantdWwD7hYevQiFHaUSBsazQ9pw0="

ota:
  - platform: esphome
    on_begin:
      - lambda: 'id(mycc1101).standby();'

    password: panel2025
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Bedrooms RF2 Fallback Hotspot
    password: !secret ap_password

captive_portal:

# --- SPI Bus ---
spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6
  miso_pin: GPIO5

# --- CC1101 Module (RadioLib - half-duplex TX+RX on single GDO0) ---
radiolib_cc1101:
  id: mycc1101
  cs_pin: GPIO7
  rx_pin:
    number: GPIO2
    allow_other_uses: true
  frequency: 433.92mhz
  filter: 468khz
  bitrate: 10

# --- Remote Transmitter (via GDO0) ---
remote_transmitter:
  pin:
    number: GPIO2
    allow_other_uses: true
    mode:
      output: true
      input: true
      pullup: true
      open_drain: true
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - lambda: 'id(mycc1101).xmit();'
  on_complete:
    then:
      - lambda: 'id(mycc1101).recv();'

# --- Remote Receiver (via GDO0 - half-duplex shared with TX) ---
remote_receiver:
  pin:
    number: GPIO2
    allow_other_uses: true
    mode:
      input: true
      output: false
      pullup: true
      open_drain: false
  dump:
    - rc_switch
#    - raw
  tolerance: 50%
  filter: 200us
  idle: 4ms
  buffer_size: 10kb

# ======================================================================
# GLOBALS - State tracking for both fans
# ======================================================================
globals:
  # === BEDROOM FAN ===
  - id: fan_speed
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_light_state
    type: bool
