      protocol: 1
    on_press:
      - lambda: |-
          ESP_LOGI("rf", ">> Bedroom Fan: NATURAL");
          if (!id(natural_cooldown)) {
            id(natural_cooldown) = true;
            id(fan_natural_mode) = !id(fan_natural_mode);
            id(fan_natural_sensor).publish_state(id(fan_natural_mode));
          }
      - if:
          condition:
            lambda: 'return !id(fan_power_switch).state;'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.bedroom_bedroom_main_fan_light
      - script.execute: reset_natural_cooldown


  # === HILA POWER SWITCH STATE (from HA) ===
  - platform: homeassistant
    name: "Hila Fan Power Switch"
    id: hila_fan_power_switch
    entity_id: switch.hila_hila_main_fan_light
    on_state:
      - lambda: |-
          if (!x) {
            ESP_LOGI("power", "Hila Power OFF - saving state and clearing");
            id(saved_hila_fan_speed) = id(hila_fan_speed);
            id(saved_hila_fan_light) = id(hila_fan_light_state);
            id(saved_hila_fan_on) = id(hila_fan_on_state);
            id(saved_hila_fan_natural) = id(hila_fan_natural_mode);
            id(saved_hila_fan_reverse) = id(hila_fan_reverse_state);
            id(hila_fan_speed) = 0; id(hila_fan_on_state) = false;
            id(hila_fan_light_state) = false; id(hila_fan_natural_mode) = false;
            id(hila_fan_reverse_state) = false;
            id(hila_fan_speed_sensor).publish_state(0);
            id(hila_fan_state_sensor).publish_state(false);
            id(hila_fan_light_sensor).publish_state(false);
            id(hila_fan_natural_sensor).publish_state(false);
            id(hila_fan_reverse_sensor).publish_state(false);
          } else {
            if (id(hila_fan_speed) == 0 && !id(hila_fan_on_state) && !id(hila_fan_light_state)) {
              ESP_LOGI("power", "Hila Power ON - restoring saved state");
              id(hila_fan_speed) = id(saved_hila_fan_speed);
              id(hila_fan_on_state) = id(saved_hila_fan_on);
              id(hila_fan_light_state) = id(saved_hila_fan_light);
              id(hila_fan_natural_mode) = id(saved_hila_fan_natural);
              id(hila_fan_reverse_state) = id(saved_hila_fan_reverse);
              id(hila_fan_speed_sensor).publish_state(id(hila_fan_speed));
              id(hila_fan_state_sensor).publish_state(id(hila_fan_on_state));
              id(hila_fan_light_sensor).publish_state(id(hila_fan_light_state));
              id(hila_fan_natural_sensor).publish_state(id(hila_fan_natural_mode));
              id(hila_fan_reverse_sensor).publish_state(id(hila_fan_reverse_state));
            } else {
