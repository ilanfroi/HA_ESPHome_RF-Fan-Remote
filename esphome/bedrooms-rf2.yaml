  - id: hila_fan_on_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: hila_fan_natural_mode
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: hila_fan_reverse_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: hila_light_cooldown
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: hila_reverse_cooldown
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: hila_natural_cooldown
    type: bool
    restore_value: no
    initial_value: 'false'
  # === HILA SAVED STATE (for power switch off/on) ===
  - id: saved_hila_fan_speed
    type: int
    restore_value: yes
    initial_value: '0'
  - id: saved_hila_fan_light
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: saved_hila_fan_on
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: saved_hila_fan_natural
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: saved_hila_fan_reverse
    type: bool
