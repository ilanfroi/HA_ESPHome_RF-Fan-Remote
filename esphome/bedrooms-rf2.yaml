  # === TAL POWER SWITCH STATE (from HA) ===
  - platform: homeassistant
    name: "Tal Fan Power Switch"
    id: tal_fan_power_switch
    entity_id: switch.tal_tal_main_fan_light
    on_state:
      - lambda: |-
          if (!x) {
            ESP_LOGI("power", "Tal Power OFF - saving state and clearing");
            id(saved_tal_fan_speed) = id(tal_fan_speed);
            id(saved_tal_fan_light_mode) = id(tal_fan_light_mode);
            id(saved_tal_fan_on) = id(tal_fan_on_state);
            id(saved_tal_fan_natural) = id(tal_fan_natural_mode);
            id(saved_tal_fan_reverse) = id(tal_fan_reverse_state);
            id(saved_tal_fan_led_level) = id(tal_fan_led_level);
            id(tal_fan_speed) = 0; id(tal_fan_on_state) = false;
            id(tal_fan_light_mode) = 0; id(tal_fan_natural_mode) = false;
            id(tal_fan_reverse_state) = false;
            id(tal_fan_speed_sensor_tal).publish_state(0);
            id(tal_fan_state_sensor).publish_state(false);
            id(tal_fan_light_mode_sensor).publish_state(0);
            id(tal_fan_natural_sensor).publish_state(false);
            id(tal_fan_reverse_sensor).publish_state(false);
            id(tal_fan_led_level_sensor).publish_state(0);
          } else {
            if (id(tal_fan_speed) == 0 && !id(tal_fan_on_state) && id(tal_fan_light_mode) == 0) {
              ESP_LOGI("power", "Tal Power ON - restoring saved state");
              id(tal_fan_speed) = id(saved_tal_fan_speed);
              id(tal_fan_on_state) = id(saved_tal_fan_on);
              id(tal_fan_light_mode) = id(saved_tal_fan_light_mode);
              id(tal_fan_natural_mode) = id(saved_tal_fan_natural);
              id(tal_fan_reverse_state) = id(saved_tal_fan_reverse);
              id(tal_fan_led_level) = id(saved_tal_fan_led_level);
              id(tal_fan_speed_sensor_tal).publish_state(id(tal_fan_speed));
              id(tal_fan_state_sensor).publish_state(id(tal_fan_on_state));
              id(tal_fan_light_mode_sensor).publish_state(id(tal_fan_light_mode));
              id(tal_fan_natural_sensor).publish_state(id(tal_fan_natural_mode));
              id(tal_fan_reverse_sensor).publish_state(id(tal_fan_reverse_state));
              id(tal_fan_led_level_sensor).publish_state(id(tal_fan_led_level));
            } else {
              ESP_LOGI("power", "Tal Power ON via RF - state already set by remote");
            }
          }

