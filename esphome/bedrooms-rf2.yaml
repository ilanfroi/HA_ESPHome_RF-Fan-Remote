# ESP32-C3 + CC1101 Ceiling Fan RF Control
# Uses RadioLib external component for reliable TX+RX on single GDO0 pin
#
# Hardware: ESP32-C3 Super Mini Plus + Ebyte E07-M1101D (CC1101 433MHz)
# Protocol: 30-bit OOK (29 data + 1 even parity), 433.92 MHz
#
# IMPORTANT: ESPHome's built-in cc1101 TX is broken (issue #16876).
# This config uses juanboro/esphome-radiolib-cc1101 which works correctly.

substitutions:
  device_name: bedrooms-rf2
  friendly_name: "Bedrooms RF Controller"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    then:
      - lambda: |-
          // Start in RX mode on boot
          id(radio1).recv();

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# --- Secrets (replace with your values in secrets.yaml) ---
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: |-
            // Put radio in standby during OTA to prevent interference
            id(radio1).standby();

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-AP"
    password: !secret ap_password

captive_portal:

logger:
  level: DEBUG

# --- External Component: RadioLib CC1101 ---
external_components:
  - source:
      type: git
      url: https://github.com/juanboro/esphome-radiolib-cc1101
      ref: main
    components: [radiolib_cc1101]

# --- SPI Bus ---
spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6
  miso_pin: GPIO5

# --- RadioLib CC1101 Configuration ---
radiolib_cc1101:
  id: radio1
  cs_pin: GPIO7
  gdo0_pin: GPIO2
  frequency: 433.92
  modulation: "OOK"
  bit_rate: 1.0
  on_transmit:
    then:
      - lambda: |-
          id(radio1).xmit();
  on_complete:
    then:
      - lambda: |-
          id(radio1).recv();

# --- Remote Transmitter (TX) ---
# OOK modulation: carrier_duty_percent=100% (no PWM), carrier_frequency=0Hz
# The CC1101 module generates the 433.92MHz carrier internally
remote_transmitter:
  id: rf_tx
  pin: GPIO2
  carrier_duty_percent: 100%
  carrier_frequency: 0Hz

# --- Remote Receiver (RX) ---
# idle must be > 7093us inter-frame gap
remote_receiver:
  id: rf_rx
  pin:
    number: GPIO2
    mode: INPUT_PULLUP
  filter: 200us
  idle: 8000us
  tolerance: 50%
  on_rc_switch:
    - lambda: |-
        // Log received codes for debugging
        ESP_LOGD("rf_rx", "RC Switch: protocol=%d, code=0x%llX (%lld)",
                 x.protocol, x.code, x.code);

