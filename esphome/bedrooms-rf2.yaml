                  entity_id: switch.bedroom_bedroom_main_fan_light

  - platform: remote_receiver
    name: "RF Bedroom Reverse Received"
    id: rf_reverse_received
    internal: true
    rc_switch_raw:
      code: '01110110110101111010100101011'
      protocol: 1
    on_press:
      - lambda: |-
          ESP_LOGI("rf", ">> Bedroom Fan: REVERSE");
          if (!id(reverse_cooldown)) {
            id(reverse_cooldown) = true;
            id(fan_reverse_state) = !id(fan_reverse_state);
            id(fan_reverse_sensor).publish_state(id(fan_reverse_state));
          }
      - if:
          condition:
            lambda: 'return !id(fan_power_switch).state;'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
