# --- State Tracking via RX ---
# These binary sensors track the physical remote's transmissions
# to keep Home Assistant state in sync

binary_sensor:
  - platform: remote_receiver
    name: "Hila Fan Remote - OFF"
    rc_switch_raw:
      code: "10011001000111011011110010001"
      protocol: 1
    filters:
      - delayed_off: 500ms

  - platform: remote_receiver
    name: "Bedroom Fan Remote - OFF"
    rc_switch_raw:
      code: "01110110110101111010110010001"
      protocol: 1
    filters:
      - delayed_off: 500ms

# --- Diagnostic Sensors ---
sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "${friendly_name} Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
