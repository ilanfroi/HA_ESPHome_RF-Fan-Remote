                  entity_id: switch.bedroom_bedroom_main_fan_light

  - platform: remote_receiver
    name: "RF Bedroom Speed 4 Received"
    id: rf_speed4_received
    internal: true
    rc_switch_raw:
      code: '01110110110101111010110001001'
      protocol: 1
    on_press:
      - lambda: |-
          ESP_LOGI("rf", ">> Bedroom Fan: SPEED 4");
          id(fan_on_state) = true;
