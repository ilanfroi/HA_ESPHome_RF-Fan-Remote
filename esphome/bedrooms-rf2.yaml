# --- DEBOUNCE SCRIPTS ---
script:
  - id: reset_light_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(light_cooldown) = false;'
  - id: reset_reverse_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(reverse_cooldown) = false;'
  - id: reset_natural_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(natural_cooldown) = false;'
  - id: reset_hila_light_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(hila_light_cooldown) = false;'
  - id: reset_hila_reverse_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(hila_reverse_cooldown) = false;'
  - id: reset_hila_natural_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(hila_natural_cooldown) = false;'

  - id: reset_tal_light_mode_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(tal_light_mode_cooldown) = false;'
  - id: reset_tal_natural_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(tal_natural_cooldown) = false;'
  - id: reset_tal_reverse_cooldown
    mode: restart
    then:
      - delay: 1500ms
      - lambda: 'id(tal_reverse_cooldown) = false;'

# --- STATUS LOGGING ---
interval:
  - interval: 60s
    then:
      - lambda: |-
          ESP_LOGI("status", "=== FAN STATUS ===");
          ESP_LOGI("status", "Bedroom: speed=%d, on=%d, light=%d, natural=%d, reverse=%d",
            id(fan_speed), (int)id(fan_on_state), (int)id(fan_light_state),
            (int)id(fan_natural_mode), (int)id(fan_reverse_state));
          ESP_LOGI("status", "Hila: speed=%d, on=%d, light=%d, natural=%d, reverse=%d",
            id(hila_fan_speed), (int)id(hila_fan_on_state), (int)id(hila_fan_light_state),
            (int)id(hila_fan_natural_mode), (int)id(hila_fan_reverse_state));
          ESP_LOGI("status", "Tal: speed=%d, on=%d, light_mode=%d, natural=%d, reverse=%d",
            id(tal_fan_speed), (int)id(tal_fan_on_state), id(tal_fan_light_mode),
            (int)id(tal_fan_natural_mode), (int)id(tal_fan_reverse_state));

# ======================================================================
# BINARY SENSORS - RF RECEIVER (state tracking from physical remotes)
# ======================================================================
binary_sensor:

  # === POWER SWITCH STATE (from HA) ===
  - platform: homeassistant
    name: "Fan Power Switch"
    id: fan_power_switch
    entity_id: switch.bedroom_bedroom_main_fan_light
    on_state:
      - lambda: |-
          if (!x) {
            ESP_LOGI("power", "Power OFF - saving state and clearing");
            id(saved_fan_speed) = id(fan_speed);
            id(saved_fan_light) = id(fan_light_state);
            id(saved_fan_on) = id(fan_on_state);
            id(saved_fan_natural) = id(fan_natural_mode);
            id(saved_fan_reverse) = id(fan_reverse_state);
            id(fan_speed) = 0; id(fan_on_state) = false;
            id(fan_light_state) = false; id(fan_natural_mode) = false;
            id(fan_reverse_state) = false;
            id(fan_speed_sensor).publish_state(0);
            id(fan_state_sensor).publish_state(false);
            id(fan_light_sensor).publish_state(false);
            id(fan_natural_sensor).publish_state(false);
            id(fan_reverse_sensor).publish_state(false);
          } else {
            if (id(fan_speed) == 0 && !id(fan_on_state) && !id(fan_light_state)) {
              ESP_LOGI("power", "Power ON - restoring saved state");
              id(fan_speed) = id(saved_fan_speed);
              id(fan_on_state) = id(saved_fan_on);
              id(fan_light_state) = id(saved_fan_light);
              id(fan_natural_mode) = id(saved_fan_natural);
              id(fan_reverse_state) = id(saved_fan_reverse);
              id(fan_speed_sensor).publish_state(id(fan_speed));
              id(fan_state_sensor).publish_state(id(fan_on_state));
              id(fan_light_sensor).publish_state(id(fan_light_state));
              id(fan_natural_sensor).publish_state(id(fan_natural_mode));
              id(fan_reverse_sensor).publish_state(id(fan_reverse_state));
            } else {
              ESP_LOGI("power", "Power ON via RF - state already set by remote");
            }
          }

  # ============================
  # BEDROOM FAN - RX
  # ============================
  - platform: remote_receiver
    name: "RF Bedroom Light Received"
    id: rf_light_received
    internal: true
    rc_switch_raw:
      code: '01110110110101111010010110101'
      protocol: 1
    on_press:
      - lambda: |-
          ESP_LOGI("rf", ">> Bedroom Fan: LIGHT");
          if (!id(light_cooldown)) {
            id(light_cooldown) = true;
            id(fan_light_state) = !id(fan_light_state);
            id(fan_light_sensor).publish_state(id(fan_light_state));
          }
      - if:
          condition:
            lambda: 'return !id(fan_power_switch).state;'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.bedroom_bedroom_main_fan_light
      - script.execute: reset_light_cooldown

  - platform: remote_receiver
    name: "RF Bedroom Fan Off Received"
    id: rf_fan_off_received
    internal: true
    rc_switch_raw:
      code: '01110110110101111010110010001'
      protocol: 1
    on_press:
      - lambda: |-
          ESP_LOGI("rf", ">> Bedroom Fan: OFF");
          id(fan_on_state) = false;
          id(fan_speed) = 0;
          id(fan_state_sensor).publish_state(false);
          id(fan_speed_sensor).publish_state(0);
      - if:
          condition:
            lambda: 'return !id(fan_power_switch).state;'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.bedroom_bedroom_main_fan_light

  - platform: remote_receiver
    name: "RF Bedroom Speed 1 Received"
    id: rf_speed1_received
    internal: true
    rc_switch_raw:
      code: '01110110110101111010111101000'
      protocol: 1
    on_press:
      - lambda: |-
          ESP_LOGI("rf", ">> Bedroom Fan: SPEED 1");
          id(fan_on_state) = true;
          id(fan_speed) = 1;
          id(fan_state_sensor).publish_state(true);
          id(fan_speed_sensor).publish_state(1);
      - if:
          condition:
            lambda: 'return !id(fan_power_switch).state;'
          then:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.bedroom_bedroom_main_fan_light

  - platform: remote_receiver
    name: "RF Bedroom Speed 2 Received"
    id: rf_speed2_received
    internal: true
    rc_switch_raw:
      code: '01110110110101111010111001000'
      protocol: 1
    on_press:
      - lambda: |-
          ESP_LOGI("rf", ">> Bedroom Fan: SPEED 2");
          id(fan_on_state) = true;
          id(fan_speed) = 2;
          id(fan_state_sensor).publish_state(true);
          id(fan_speed_sensor).publish_state(2);
      - if:
